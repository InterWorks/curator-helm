{{- /*
A pre-install hook so the Secret exists for the db-migrate-install Job (weight 50),
which seeds the first backend user from it. ESO syncs it asynchronously; until it
does, the Job's pod sits in CreateContainerConfigError and then starts. As a hook it
is not part of the release manifest, so Helm never updates it on upgrade. Helm deletes
hook-succeeded hooks only after every pre-install hook has finished, so it is removed
(and ESO garbage-collects the Secret it owns) once the install job has seeded the
admin, leaving no admin credentials in the cluster.
*/}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}-admin
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": pre-install
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": hook-succeeded
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: k8s
  target:
    creationPolicy: Owner
  data:
  - secretKey: admin-user
    remoteRef:
      key: {{ .Release.Name }}-initial-admin
      property: username
  - secretKey: admin-password
    remoteRef:
      key: {{ .Release.Name }}-initial-admin
      property: password