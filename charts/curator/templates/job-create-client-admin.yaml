{{- if .Values.curator.clientAdmin.enabled }}
{{- /*
Creates a second, limited-permission backend admin for the client, distinct from the superadmin the install
migration seeds (job-db-migrate-install.yaml / externalsecrets-admin.yaml). Needs a Curator image whose
backenduser:create accepts --permissions; without it every permission the Backend Users page can manage would
be granted, same as backenduser:create's default. Post-install, not pre-install, so it never blocks the
install migration. Weight 50 so it runs after externalsecrets-client-admin.yaml (weight -10). --if-not-exists
makes a reinstall onto existing data (a release rename, or a rebuild restored from backup) a no-op instead of
a duplicate-login error; it does not re-apply curator.clientAdmin.permissions to an account whose permissions
have since changed on the Backend Users page -- use "php artisan backenduser:grant" for that.
*/}}
apiVersion: batch/v1
kind: Job
metadata:
  name: "{{ .Release.Name }}-client-admin-creation"
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
    app.kubernetes.io/version: {{ .Chart.AppVersion }}
    helm.sh/chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
  annotations:
    "helm.sh/hook": post-install
    "helm.sh/hook-weight": "50"
spec:
  template:
    metadata:
      name: "{{ .Release.Name }}-client-admin-creation"
      labels:
        app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
        app.kubernetes.io/instance: {{ .Release.Name | quote }}
        helm.sh/chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      restartPolicy: Never
      serviceAccountName: {{ include "curator.serviceAccountName" . }}
      containers:
      - name: create-client-admin
        image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        volumeMounts:
        - name: framework
          mountPath: /var/www/html/storage/framework
        - name: logs
          mountPath: /var/www/html/storage/logs
        - name: temp
          mountPath: /var/www/html/storage/temp
        - name: cms
          mountPath: /var/www/html/storage/cms
        - name: data
          mountPath: /var/www/html/storage/app
        {{- if .Values.curator.config }}
        {{- range $key, $value := .Values.curator.config }}
        - name: config
          mountPath: /var/www/html/config/{{ $key }}.php
          subPath: {{ $key }}.php
        {{- end }}
        {{- end }}
        {{- with .Values.extraVolumeMounts }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- /* $() substitution, not a shell wrapper: Kubernetes resolves $(VAR) against this container's own env,
        so no quoting of the permission list (or the generated password) is needed. */}}
        command:
        - php
        - artisan
        - backenduser:create
        - --if-not-exists
        - --permissions=$(CLIENT_ADMIN_PERMISSIONS)
        - $(CLIENT_ADMIN_USER)
        - $(CLIENT_ADMIN_PASSWORD)
        - $(CLIENT_ADMIN_EMAIL)
        env:
          {{- include "env.environment" . | nindent 10 }}
          - name: CLIENT_ADMIN_PERMISSIONS
            value: {{ join "," .Values.curator.clientAdmin.permissions | quote }}
          - name: CLIENT_ADMIN_USER
            valueFrom:
              secretKeyRef:
                name: {{ .Release.Name }}-client-admin
                key: client-admin-user
          - name: CLIENT_ADMIN_PASSWORD
            valueFrom:
              secretKeyRef:
                name: {{ .Release.Name }}-client-admin
                key: client-admin-password
          - name: CLIENT_ADMIN_EMAIL
            valueFrom:
              secretKeyRef:
                name: {{ .Release.Name }}-client-admin
                key: client-admin-email
          {{- /* directHost, not host: DDL and admin writes go straight to the primary,
          bypassing MaxScale. Falls back to host when directHost is unset. */}}
          - name: DB_HOST
            value: {{ include "curator.dbDirectHost" . }}
          {{- range $key, $value := .Values.curator.env }}
          - name: "{{ $key }}"
            value: "{{ $value }}"
          {{- end }}
      volumes:
      - name: framework
        emptyDir:
      - name: logs
        emptyDir:
      - name: temp
        emptyDir:
      - name: cms
        emptyDir:
      {{ if (and .Values.persistence.enabled (not .Values.persistence.s3.enabled)) -}}
      - name: data
        persistentVolumeClaim:
          claimName: {{ printf "%s-%s" "data" .Release.Name }}
      {{- else -}}
      - name: data
        emptyDir:
      {{- end }}
      {{- if .Values.curator.config }}
      - name: config
        configMap:
          name: {{ include "curator.fullname" . }}-config
      {{- end }}
      {{- with .Values.extraVolumes }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
