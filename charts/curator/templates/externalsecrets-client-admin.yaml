{{- if .Values.curator.clientAdmin.enabled }}
{{- /*
A post-install hook (not pre-install, like externalsecrets-admin.yaml) because the client admin is unrelated to
the install migration's superadmin seed and must not block it. Weight -10 so the Secret exists before
job-create-client-admin.yaml (weight 50) reads it; ESO syncs it asynchronously, and until it does the Job's pod
sits in CreateContainerConfigError and then starts. As a hook it is not part of the release manifest, so Helm
never updates it on upgrade -- the login/password Terraform wrote to the <release>-client-admin 1Password item
at first apply are what every install reads. Deleted (with its Secret) once the post-install hooks finish, so no
client-admin credentials linger in the cluster; before-hook-creation (an explicit policy replaces Helm's default)
lets a retried install replace a copy left behind by an interrupted one instead of failing with "already exists".
*/}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}-client-admin
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": post-install
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: k8s
  target:
    creationPolicy: Owner
  data:
  - secretKey: client-admin-user
    remoteRef:
      key: {{ .Release.Name }}-client-admin
      property: username
  - secretKey: client-admin-password
    remoteRef:
      key: {{ .Release.Name }}-client-admin
      property: password
  - secretKey: client-admin-email
    remoteRef:
      key: {{ .Release.Name }}-client-admin
      property: email
{{- end }}
