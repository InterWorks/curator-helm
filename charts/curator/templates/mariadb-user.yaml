apiVersion: k8s.mariadb.com/v1alpha1
kind: User
metadata:
  name: {{ .Values.mariadbOperator.user.username | default "curator" }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "curator.mariadbLabels" . | nindent 4 }}
  annotations:
    {{- with (include "curator.mariadbAnnotations" .) }}{{ . | nindent 4 }}{{ end }}
    "helm.sh/hook": pre-install
    "helm.sh/hook-weight": "40"
spec:
  mariaDbRef:
    name: {{ .Values.mariadbOperator.mariadbName | default "curator-mariadb" }}
    namespace: {{ .Values.mariadbOperator.mariadbNamespace | default .Release.Namespace }}
  passwordSecretKeyRef:
    name: {{ .Values.mariadbOperator.user.userPasswordSecretKeyRef.name }}
    key: {{ .Values.mariadbOperator.user.userPasswordSecretKeyRef.key }}
  maxUserConnections: {{ .Values.mariadbOperator.user.maxUserConnections | default 151 }}