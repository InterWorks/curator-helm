# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: test mariadb backup
templates:
  - mariadb-backup.yaml
release:
  name: curator
tests:
  - it: renders by default when mariadbOperator is enabled
    set:
      mariadbOperator.enabled: true
    asserts:
      - isKind:
          of: Backup

  - it: does not render when mariadbOperator.backup.enabled is false
    set:
      mariadbOperator.enabled: true
      mariadbOperator.backup.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: does not render when mariadbOperator is disabled
    set:
      mariadbOperator.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: renders in the release namespace when mariadbNamespace is unset
    set:
      mariadbOperator.enabled: true
    asserts:
      - equal:
          path: metadata.namespace
          value: NAMESPACE

  - it: renders next to a centralized MariaDB in mariadbNamespace
    set:
      mariadbOperator.enabled: true
      mariadbOperator.mariadbNamespace: curator-mariadb
    asserts:
      - equal:
          path: metadata.namespace
          value: curator-mariadb
      - equal:
          path: spec.mariaDbRef.namespace
          value: curator-mariadb
