# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
# Database/User/Grant names are opaque random pets, so each carries labels and an
# annotation that tie it back to its site.
suite: test mariadb CR identity metadata
templates:
  - mariadb-database.yaml
  - mariadb-user.yaml
  - mariadb-grant.yaml
release:
  name: qa-talent-chambers-com
  namespace: orbach-and-chambers-ltd
tests:
  - it: labels every CR with the owning release and namespace
    set:
      ingress.hosts:
        - host: qa.talent.chambers.com
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/instance"]
          value: qa-talent-chambers-com
      - equal:
          path: metadata.labels["curator.interworks.com/release-namespace"]
          value: orbach-and-chambers-ltd
      - equal:
          path: metadata.annotations["curator.interworks.com/site"]
          value: qa.talent.chambers.com

  - it: omits the site annotation when there are no ingress hosts
    set:
      ingress.hosts: []
    asserts:
      - notExists:
          path: metadata.annotations["curator.interworks.com/site"]
