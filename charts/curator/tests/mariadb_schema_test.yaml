# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
# The mariadbOperator schema is the guard against silently routing a site to the
# wrong database: a misspelled key used to be ignored and fall back to a chart
# default. These tests pin that it now fails the render instead.
suite: test mariadbOperator values schema
templates:
  - mariadb-database.yaml
release:
  name: curator
tests:
  - it: accepts a centralized site's values
    set:
      mariadbOperator.mariadbNamespace: curator-mariadb
      mariadbOperator.maxscaleEndpoint: curator-maxscale
      mariadbOperator.database.name: abnormally-vigorously-absolute-aardvark
      mariadbOperator.user.username: abnormally-vigorously-absolute-aardvark
      mariadbOperator.user.userPasswordSecretKeyRef.name: abnormally-vigorously-absolute-aardvark-mariadb
    asserts:
      - isKind:
          of: Database

  - it: rejects a misspelled top-level key (mariaDbName)
    set:
      mariadbOperator.mariaDbName: curator-mariadb
    asserts:
      - failedTemplate:
          errorPattern: "additional properties 'mariaDbName' not allowed"

  - it: rejects the removed auth block
    set:
      mariadbOperator.auth.username: prod
    asserts:
      - failedTemplate:
          errorPattern: "additional properties 'auth' not allowed"

  - it: rejects a misspelled nested key
    set:
      mariadbOperator.user.maxUserConnection: 40
    asserts:
      - failedTemplate:
          errorPattern: "additional properties 'maxUserConnection' not allowed"

  - it: rejects a database name that is not a valid Kubernetes name
    set:
      mariadbOperator.database.name: prod_bold_otter
    asserts:
      - failedTemplate:
          errorPattern: "does not match pattern"

  - it: rejects a database name longer than the 52-character CronJob limit
    set:
      mariadbOperator.database.name: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    asserts:
      - failedTemplate:
          errorPattern: "maxLength"

  - it: treats an empty mariadbNamespace as unset (release namespace)
    set:
      mariadbOperator.mariadbNamespace: ""
    asserts:
      - isKind:
          of: Database
      - equal:
          path: spec.mariaDbRef.namespace
          value: NAMESPACE

  - it: still rejects an invalid mariadbNamespace
    set:
      mariadbOperator.mariadbNamespace: Curator_MariaDB
    asserts:
      - failedTemplate:
          errorPattern: "does not match pattern"

  - it: rejects an empty mariadbName (DB_HOST would become ".<namespace>")
    set:
      mariadbOperator.mariadbName: ""
    asserts:
      - failedTemplate:
          errorPattern: "does not match pattern"
