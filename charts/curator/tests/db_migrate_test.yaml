# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
# portal:migrate runs as two hook Jobs. Only the pre-install one gets the admin
# credentials, which Winter uses to seed the first backend user on a fresh database (so no
# random admin password is printed to the job log). Upgrades must never see them. The
# admin ExternalSecret is a pre-install hook at a lower weight so its Secret exists first,
# and is deleted once the install hooks succeed.
suite: test db-migrate jobs and the admin ExternalSecret
templates:
  - job-db-migrate-install.yaml
  - job-db-migrate-upgrade.yaml
  - externalsecrets-admin.yaml
values:
  - values/database.yaml
release:
  name: curator
tests:
  - it: runs the install job as a pre-install hook only
    template: job-db-migrate-install.yaml
    asserts:
      - equal:
          path: metadata.name
          value: curator-db-migrate-install
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: pre-install
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "50"
      - equal:
          path: spec.template.metadata.name
          value: curator-db-migrate-install

  - it: runs the upgrade job as a pre-upgrade hook only, under the pre-split name
    template: job-db-migrate-upgrade.yaml
    asserts:
      - equal:
          path: metadata.name
          value: curator-db-migrate
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: pre-upgrade
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "50"
      - equal:
          path: spec.template.metadata.name
          value: curator-db-migrate

  - it: runs portal:migrate in both jobs
    asserts:
      - equal:
          path: spec.template.spec.containers[0].command
          value: [php, artisan, portal:migrate]
        template: job-db-migrate-install.yaml
      - equal:
          path: spec.template.spec.containers[0].command
          value: [php, artisan, portal:migrate]
        template: job-db-migrate-upgrade.yaml

  - it: passes the admin credentials to the install job from the admin Secret
    template: job-db-migrate-install.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: WEBADMIN_USER
            valueFrom:
              secretKeyRef:
                name: curator-admin
                key: admin-user
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: WEBADMIN_PASSWORD
            valueFrom:
              secretKeyRef:
                name: curator-admin
                key: admin-password

  - it: never passes the admin credentials to the upgrade job
    template: job-db-migrate-upgrade.yaml
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: WEBADMIN_USER
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: WEBADMIN_PASSWORD
          any: true

  - it: makes the admin ExternalSecret a pre-install hook ahead of the install job
    template: externalsecrets-admin.yaml
    asserts:
      - isKind:
          of: ExternalSecret
      - equal:
          path: metadata.name
          value: curator-admin
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: pre-install
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "-10"
      # removed (with its Secret) once the pre-install hooks finish, so no admin credentials linger;
      # before-hook-creation lets a retried install replace a leftover copy
      - equal:
          path: metadata.annotations["helm.sh/hook-delete-policy"]
          value: before-hook-creation,hook-succeeded
