# -- Number of replicas to deploy
replicaCount: ~

# -- Environment type (prod, qa, or dev). Used for cache prefix, database defaults, and resource sizing
environment: prod # needs to be either dev, qa, or prod

# -- Image configuration
image:
  # -- Repository name
  repository: curator 
  # -- Registry URL
  registry: ghcr.io/interworks
  # -- Image Pull Policy
  pullPolicy: IfNotPresent
  # -- Tag Name, overrides the default appVersion in Chart.yaml
  tag: latest@sha256:6a664746f21dd27c448f7909a6a0fb526f1448f103d65ee8d0cd1725f11579d0

# -- Overrides the chart name, default is the name of the release
nameOverride: ""
# -- Overrides the full name of the chart, default is the name of the release
fullnameOverride: ""

# Service account configuration
serviceAccount:
  # -- Specifies whether a ServiceAccount should be created
  create: true
  # -- The name of the ServiceAccount to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ~
  # -- Image pull secrets for the service account
  imagePullSecrets: []
  # -- Annotations for the service account
  annotations: {}
  # -- Labels for the service account
  labels: {}
  # -- Set this toggle to false to opt out of automounting API credentials for the service account
  automountServiceAccountToken: false

# Service configuration
service:
  # -- Service Type
  type: ClusterIP
  # -- Service Port
  port: 8080

## Curator Ingress Section
ingress:
  # -- Control for ingress
  enabled: true
  # -- Ingress Class Name
  className: ~
  # -- Ingress hosts configuration
  hosts: []
    # - host: curator.example.com
    #   paths:
    #     - path: /
    #       pathType: ImplementationSpecific
  # -- TLS config
  tls: []
    # - secretName: *hyphenName
    #   hosts:
    #   - curator.example.com

# Container Security Context
securityContext: {}
#   fsGroup: 3000
#   fsGroupChangePolicy: OnRootMismatch
#   runAsGroup: 3000
#   runAsUser: 33

# Pod Security Context
podSecurityContext: {}
#   fsGroup: 3000
#   fsGroupChangePolicy: OnRootMismatch
#   runAsGroup: 3000
#   runAsUser: 33

podDisruptionBudget:
  # -- Enable Pod Disruption Budget
  enabled: false
  # -- Max Unavailable pods, default is 1
  maxUnavailable: ~
  # -- Min Available pods, default is 1
  minAvailable: ~
  # -- Selector for the PDB
  selector: {}
    # matchLabels: 
    #   app.kubernetes.io/name: {{ include "curator.name" . }}
    #   app.kubernetes.io/instance: {{ .Release.Name }}

# Cronjob Configuration
cronjob:
  affinity: {}
  env: {}
  nodeSelector: {}
  successfulJobsHistoryLimit: 1

# -- Resource configuration, environment will control resources if left blank but can be overridden
resources: {}
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

## Curator Persistence config
persistence:
  # -- enable persistence
  enabled: true
  s3:
    # -- enable S3 storage, if disable and peristence.enabled is true, it will use PVC
    enabled: false
    # -- bucket to use for storage
    bucket: some-bucket
    # -- region bucket is in
    region: ""
    # -- custom S3-compatible endpoint, leave unset to use AWS
    endpoint: ~
    # -- secret containing the AWS access key id, leave unset to rely on IRSA/instance role credentials
    accessKeyIdSecret:
      name: ~
      key: ~
    # -- secret containing the AWS secret access key, leave unset to rely on IRSA/instance role credentials
    secretAccessKeySecret:
      name: ~
      key: ~
  # -- existingClaim is the name of an existing persistent volume claim to use for storage
  existingClaim: ""
  # -- size of persistent volume claim
  size: 5Gi
  # -- persistent volume claim accessMode
  accessModes: []
    # - ReadWriteOnce
  # -- persistent volume claim labels
  labels: {}
  # -- persistent volume claim annotations
  annotations: {}
  # -- persistent volume claim storageClass
  storageClass: ~
  # -- persistent volume claim subpath
  subPath: ""

autoscaling:
  # -- enable autoscaling
  enabled: false
  # -- minimum number of replicas
  minReplicas: ~
  # -- maximum number of replicas
  maxReplicas: ~
  # -- scaling metrics
  metrics: []
    # - type: Resource
    #   resource:
    #     name: cpu
    #     target:
    #       type: Utilization
    #       averageUtilization: 75
    # - type: Resource
    #   resource:
    #     name: memory
    #     target:
    #       type: Utilization
    #       averageUtilization: 75
  # -- scaling behavior
  behavior: {}

## -- Pod nodeselector
nodeSelector: {}

## -- Pod tolerations
tolerations: []

## -- Pod affinity parameters
affinity: {}

# -- Pod Topology Spread Constraints
topologySpreadConstraints: []
  # - maxSkew:
  #   minDomains:
  #   topologyKey:
  #   whenUnsatisfiable:
  #   labelSelector:
  #   matchLabelKeys:
  #   nodeAffinityPolicy:
  #   nodeTaintsPolicy:

## Curator Configuration parameters
curator:
  # -- read environment variables from a secret
  envFromSecret: []
    # - name: ~
    #   key: ~
    #   value: ~
  # -- environment variables to set in the container
  env: {}
    # KEY: VALUE
  # -- environment variables to pass into app.php
  app:
    debug: ~
    appKeySecret:
      name: ~
      key: ~
  sentry:
    # -- Sentry Laravel DSN for error reporting
    dsn: ""
    # -- Sentry Laravel environment name, defaults to the Helm release name if not set
    environment: ""
  # -- environment variables to pass into cache.php
  cache:
    # -- cache type, possible values apc, array, database, file, memcached, redis
    driver: ~
    # -- memcached host, only used when driver is memcached
    host: ~
    # -- memcached port, only used when driver is memcached
    port: ~
    # -- cache prefix, defaults to a value derived from APP_NAME if unset
    prefix: ~
  # -- environment variables to pass into cms.php
  cms:
    routesCache: ~
    assetCache: ~
    assetMinify: ~
    # -- disk used for CMS media/uploads storage, defaults to "s3" if persistence.s3.enabled else "local"
    filesystemDriver: ~
    filesystemUploadsPath: ~
    filesystemMediaPath: ~
    enableCSRF: ~
  # -- environment variables to pass into database.php
  database:
    connection: ~
    host: ~
    # -- database port, only set this if the database is not listening on the connection's default port
    port: ~
    databaseName: ~
    username: ~
    password:
      secretKeyRef:
        name: ~
        key: ~
  # -- environment variables to pass into filesystems.php
  filesystems:
    # -- default filesystem disk, defaults to "s3" if persistence.s3.enabled else "local"
    disk: ~
  logging:
    channel: ~
    deprecationsChannel: ~
    level: ~
  mail:
    host: ~
    port: ~
    passwordSecretRef:
      name: ~
      key: ~
    username: ~
    fromAddress: ~
    fromName: ~
    ehloDomain: ~
  powerbi:
    tenant: ~
    clientIdSecretRef:
      name: ~
      key: ~
    clientSecretSecretRef:
      name: ~
      key: ~
    adminClientIdSecretRef:
      name: ~
      key: ~
    adminClientSecretSecretRef:
      name: ~
      key: ~
    redirectURI: ~
    cacheEnabled: ~
    cacheExpirySeconds: ~
  queue:
    connection: ~
  search:
    # -- search engine; allowable values: database, typesense, collection, null
    driver: ~
    # -- search prefix applied to all search index names, allows for multitenancy
    prefix: ~
    # -- allows for queuing of data sync
    queue: ~
    # -- only allowed when search driver is set to algolia
    identify:
    # -- config for connecting to algolia
    algolia:
      idSecretRef:
        name: ~
        key: ~
      secretValueSecretRef:
        name: ~
        key: ~
    # -- config for connecting to typesense
    typesense:
      # -- api key config to authenticate to typesense
      apiKeySecretRef:
        name: ~
        key: ~
      # -- typesense endpoint
      host: ~
      # -- typesense port
      port: ~
      # -- typesense path
      path: ~
      # -- typesense protocol, 
      protocol: ~
      # -- connection parameters
      connection:
        # -- in seconds, time until considered unavailable
        timeout: ~
        # -- in seconds, time between healthcheck probes
        healthcheckInterval: ~
        # -- max number of retries before considered failed
        retries: ~
        # -- number of retries allowed before considered failed
        retryInterval: ~
      # -- max number of results returned by typesense
      maxResults: ~
      # -- defines how typesense imports data
      importAction: ~
  session:
    driver: ~
    cookie: ~
    secureCookie: ~
  ## Initial Admin parameters
  auth:
    # -- secret to use for initial admin user
    existingSecret: curator-auth
  ## Delayed startup probe to allow MariaDB to start
  startupProbe:
    # -- Endpoint the probe hits; keep it cheap and dependency-free
    path: /ping
    ## -- Seconds until initial probe
    initialDelaySeconds: 10
    ## -- Period to wait before next check
    periodSeconds: 10
    ## -- Number of failures before pod is failed
    failureThreshold: 10
    # -- Timeout for probe
    timeoutSeconds: 5
  ## Probe to check for pod liveness. Keep this dependency-free (/ping) -- a database-aware
  ## endpoint here would fail every pod at once during a DB blip and trigger mass restarts.
  livenessProbe:
    # -- Endpoint the probe hits; keep it cheap and dependency-free
    path: /ping
    # -- Period to wait between checks
    periodSeconds: 10
    # -- Number of failures before pod is failed
    failureThreshold: 3
    # -- Timeout for probe
    timeoutSeconds: 15
  ## Probe to gate traffic on real readiness. /healthz verifies database connectivity and
  ## returns 503 when the DB is unreachable, so a failing pod is pulled from the Service
  ## endpoints (traffic stops) rather than restarted.
  readinessProbe:
    # -- Endpoint the probe hits; /healthz verifies the database is reachable
    path: /healthz
    # -- Period to wait between checks
    periodSeconds: 10
    # -- Number of failures before the pod is removed from the Service endpoints
    failureThreshold: 3
    # -- Timeout for probe
    timeoutSeconds: 15
  # -- These are used to override default php config files present in the containers. The files are mounted in the config directory and will append .php to the ends of the keys
  # -- If one of these is defined the above config section will no longer be applicable if the new config doesn't utilze environment variables
  config: {}
    # app: ""
    # auth: ""
    # broadcasting: ""
    # cache: ""
    # cms: ""
    # cookie: ""
    # database: ""
    # environment: ""
    # filesystems: ""
    # interworks: ""
    # logging: ""
    # mail: ""
    # services: ""
    # session: ""
    # view: ""

mariadbOperator:
  enabled: true
  # -- Name of existing mariadb resource
  mariadbName: "curator-mariadb"
  # -- Endpoint to connect to mariadb, if not set it will use the mariadbName as the hostname
  mariadbEndpoint: ""
  # -- Namespace of existing mariadb resource
  mariadbNamespace: ~
  # -- Endpoint to connect to maxscale, if not set it will default to mariadbEndpoint
  maxscaleEndpoint: ~

  ## Database to connect to
  database:
    # -- database to create
    name: "production"
    # -- character set for the database
    characterSet: "utf8"
    # -- collation for the database
    collate: "utf8_general_ci"
  user:
    # -- mariadb user to create
    username: "curator"
    # -- secret reference for the created user password
    userPasswordSecretKeyRef:
      name: production-mariadb
      key: password
    # -- maximum number of connections for the user
    maxUserConnections: 151
    # -- grantOption for the user
    grantOption: false
    # -- allowable login hosts for the user
    host: "%"
  backup:
    # -- suspend backups, if true, no backups will be created
    suspend: false
    # -- schedule to take backups
    schedule: "0 0 * * *"
    # -- retention period for backups
    retention: 168h # 7 days
    # -- s3 bucket to store backups
    bucket: ""
    # -- s3 region for bucket
    region: ""
