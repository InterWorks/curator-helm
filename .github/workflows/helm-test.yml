name: Helm Unit Tests

on:
  pull_request:

jobs:
  helm-unittest:
    runs-on: us-east-2-development
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installs the tools pinned in mise.toml (notably helm) so CI matches
      # what developers run locally.
      - name: Set up tools via mise
        uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1

      - name: Install helm-unittest plugin
        run: helm plugin install --verify=false https://github.com/helm-unittest/helm-unittest --version v1.1.1

      - name: Run helm unit tests
        run: helm unittest charts/curator
