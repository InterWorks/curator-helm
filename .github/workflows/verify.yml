name: Verify Changes

on:
  pull_request:

jobs:
  commitlint:
    runs-on: us-east-2-development
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installs node at the version pinned in mise.toml, matching local dev
      # and the other workflows.
      - name: Set up tools via mise
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1

      # `npm ci` installs the exact versions from package-lock.json, so the
      # linter can't drift between runs.
      - name: Install commitlint
        run: npm ci

      # PRs are squash-merged, so the PR title becomes the commit message on
      # main and is what release-please parses — individual commits within
      # the PR are squashed away and don't need to be conventional-commit
      # compliant.
      - name: Lint PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: echo "$PR_TITLE" | npx commitlint --verbose
