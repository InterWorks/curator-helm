name: Verify Changes

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

jobs:
  commitlint:
    runs-on: us-east-2-development
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installs node at the version pinned in mise.toml, matching local dev
      # and the other workflows.
      - name: Set up tools via mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4

      # `npm ci` installs the exact versions from package-lock.json, so the
      # linter can't drift between runs.
      - name: Install commitlint
        run: npm ci

      # release-please parses the PR title since it becomes the squash
      # commit message on main. Fetched live via the API (rather than
      # github.event.pull_request.title) so a re-run reflects the current
      # title instead of the payload from whenever the run first triggered.
      - name: Lint PR title
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.url }}
        run: |
          curl -sSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "$PR_URL" | jq -r .title | npx commitlint --verbose
